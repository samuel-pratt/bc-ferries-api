services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: release_test
      POSTGRES_USER: release_test
      POSTGRES_PASSWORD: disposable-test-only
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "release_test", "-d", "release_test"]
      interval: 2s
      timeout: 3s
      retries: 40
  tests:
    build: {context: ., target: test}
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      TEST_DATABASE_URL: postgres://release_test:disposable-test-only@db:5432/release_test?sslmode=disable
    depends_on:
      db: {condition: service_healthy}
networks:
  default:
    internal: true
